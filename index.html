<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FriendFLT - Caawiye & Kaftan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0e1117;
            --chat-bg: #161b22;
            --accent-color: #38bdf8;
            --text-color: #e6edf3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "FRIENDFLT AI 🇸🇴";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.02);
            z-index: -1;
            white-space: nowrap;
            pointer-events: none;
        }

        header {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(14, 17, 23, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #30363d;
        }

        header h1 { font-size: 1.2rem; color: var(--accent-color); margin: 0; }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center; 
        }

        .message {
            max-width: 90%;
            width: fit-content;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 16px;
            line-height: 1.6;
            text-align: center;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg { background: #1d4ed8; color: white; }
        .bot-msg { background: var(--chat-bg); border: 1px solid #30363d; color: var(--text-color); }

        .input-wrapper { padding: 20px; background: transparent; width: 100%; box-sizing: border-box; }
        .input-container {
            max-width: 800px;
            margin: 0 auto;
            background: #21262d;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
            border: 1px solid #30363d;
        }

        input { flex: 1; background: transparent; border: none; padding: 12px; color: white; outline: none; font-size: 16px; }
        .send-btn { color: var(--accent-color); cursor: pointer; padding: 10px; font-size: 1.2rem; }

        .dots::after { content: '...'; animation: typing 1s infinite; }
        @keyframes typing { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }
    </style>
</head>
<body>

<header>
    <h1>FriendFLT <small style="color: #8b949e; font-size: 0.7rem;">Caawiye AI</small></h1>
    <div style="font-size: 1.5rem;">🇸🇴</div>
</header>

<div id="chat-container">
    <div class="message bot-msg">
        Iska wada dhig nio! FriendFLT ayaan ahay. Sideen maanta kugu caawiyaa? Ma qosol baan kuugu daraa mise shaqo ayaan kuu qabtaa? 😂🚀
    </div>
</div>

<div class="input-wrapper">
    <div class="input-container">
        <input type="text" id="userInput" placeholder="Halkan wax ku qor..." onkeypress="if(event.key === 'Enter') send()">
        <i class="fas fa-paper-plane send-btn" onclick="send()"></i>
    </div>
</div>

<script>
    const API_KEY = 'AIzaSyDLnTbBi8kY3iS9pbuIkEPNysDjetZDSwg'; 

    async function send() {
        const input = document.getElementById('userInput');
        const container = document.getElementById('chat-container');
        const text = input.value.trim();
        
        if (!text) return;

        container.innerHTML += `<div class="message user-msg">${text}</div>`;
        input.value = "";
        container.scrollTop = container.scrollHeight;

        const loadingMsg = document.createElement('div');
        loadingMsg.className = 'message bot-msg';
        loadingMsg.innerHTML = 'Fikiraya <span class="dots"></span>';
        container.appendChild(loadingMsg);
        container.scrollTop = container.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Waxaad tahay FriendFLT, oo ah AI caawiye ah oo Soomaali ah. Shaqsiyaddaadu waa mid aad u furfuran, saaxiibtinimo leh, oo jecel kaftanka iyo sheekada mada daalada ah. Marka lagu weydiiyo su'aal, si cilmiyeysan uga jawaab, laakiin haddii sheekadu oggolaato, ku dar kaftan yar oo Soomaali ah. Su'aashu waa: " + text }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const reply = data.candidates[0].content.parts[0].text;
                loadingMsg.innerText = reply;
                loadingMsg.style.textAlign = "left"; 
            } else {
                loadingMsg.innerText = "Nio, API-ga ayaa xoogaa yara 'stress' qaba. Mar kale isku day!";
            }

        } catch (e) {
            loadingMsg.innerText = "Khalad ayaa dhacay. Internet-ka ma kaa go'an yahay nio?";
        }
        container.scrollTop = container.scrollHeight;
    }
</script>

</body>
</html>
