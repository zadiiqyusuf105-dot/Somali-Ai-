<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaawiyeFLT - Somali AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0e1117;
            --chat-bg: #161b22;
            --accent-color: #38bdf8;
            --text-color: #e6edf3;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            align-items: center; 
        }

        /* Watermark */
        body::before {
            content: "CAAWIYEFLT 🇸🇴";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 2.5rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.02);
            z-index: -1;
            pointer-events: none;
        }

        header {
            width: 100%;
            max-width: 800px;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(14, 17, 23, 0.9);
            border-bottom: 1px solid #30363d;
            box-sizing: border-box;
        }

        #chat-container {
            width: 100%;
            max-width: 800px;
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }

        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 16px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .user-msg { align-self: flex-end; background: #1d4ed8; color: white; border-bottom-right-radius: 5px; }
        .bot-msg { align-self: flex-start; background: var(--chat-bg); border: 1px solid #30363d; border-bottom-left-radius: 5px; }

        .input-wrapper {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
        }

        .input-container {
            background: #21262d;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
            border: 1px solid #30363d;
        }

        input { flex: 1; background: transparent; border: none; padding: 12px; color: white; outline: none; font-size: 16px; }
        .icon-btn { color: #8b949e; cursor: pointer; padding: 10px; font-size: 1.2rem; }
        .send-btn { color: var(--accent-color) !important; }

        .dots::after { content: '...'; animation: typing 1s infinite; }
        @keyframes typing { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }
    </style>
</head>
<body>

<header>
    <h1 style="font-size: 1.2rem; color: var(--accent-color); margin:0;">CaawiyeFLT <small style="color:#8b949e; font-size:0.7rem;">Somali AI</small></h1>
    <span>🇸🇴</span>
</header>

<div id="chat-container">
    <div class="message bot-msg">Iska wada dhig nio! CaawiyeFLT ayaa hadda diyaar kuu ah. Maxaan isku dhex ridaa maanta? 😂🔥</div>
</div>

<div class="input-wrapper">
    <div class="input-container">
        <input type="text" id="userInput" placeholder="Halkan wax ku qor ama ku hadal..." onkeypress="if(event.key === 'Enter') send()">
        <i class="fas fa-microphone icon-btn" id="voiceBtn"></i>
        <i class="fas fa-paper-plane icon-btn send-btn" onclick="send()"></i>
    </div>
</div>

<script>
    const API_KEY = 'AIzaSyDLnTbBi8kY3iS9pbuIkEPNysDjetZDSwg'; 

    async function send() {
        const input = document.getElementById('userInput');
        const container = document.getElementById('chat-container');
        const text = input.value.trim();
        if (!text) return;

        container.innerHTML += `<div class="message user-msg">${text}</div>`;
        input.value = "";
        container.scrollTop = container.scrollHeight;

        const loadingMsg = document.createElement('div');
        loadingMsg.className = 'message bot-msg';
        loadingMsg.innerHTML = 'Fikiraya <span class="dots"></span>';
        container.appendChild(loadingMsg);
        container.scrollTop = container.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "Waxaad tahay CaawiyeFLT, AI Soomaali ah oo aad u furfuran, sheeko yaqaan ah, oo kugu jawaabaya hab kaftan iyo saaxiibtinimo leh. Ha u hadlin sidii robot qallafsan, ee u hadal sidii saaxiib. Su'aashu waa: " + text }] }]
                })
            });
            const data = await response.json();
            loadingMsg.innerText = data.candidates[0].content.parts[0].text;
        } catch (e) {
            loadingMsg.innerText = "Nio, API-ga ayaa yara 'busy' ah. Mar kale iisoo tuur!";
        }
        container.scrollTop = container.scrollHeight;
    }

    const voiceBtn = document.getElementById('voiceBtn');
    const recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (recognition) {
        const sr = new recognition();
        sr.lang = 'so-SO';
        voiceBtn.onclick = () => { sr.start(); voiceBtn.style.color = "red"; };
        sr.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; voiceBtn.style.color = "#8b949e"; };
        sr.onspeechend = () => { sr.stop(); voiceBtn.style.color = "#8b949e"; };
    }
</script>
</body>
</html>
