<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOMALI AI</title>
    <style>
        /* Design-ka casriga ah */
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #ffffff; height: 100vh; display: flex; flex-direction: column; }
        
        .header { text-align: center; padding: 20px; font-weight: bold; color: #202124; font-size: 20px; }
        
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; max-width: 800px; margin: auto; width: 100%; box-sizing: border-box; }
        
        .input-container { max-width: 800px; margin: 20px auto; width: 90%; background: #f1f3f4; border-radius: 30px; display: flex; align-items: center; padding: 5px 20px; box-sizing: border-box; }
        
        input { flex: 1; border: none; background: transparent; padding: 15px; outline: none; font-size: 16px; }
        
        button { background: none; border: none; cursor: pointer; padding: 10px; font-size: 20px; color: #5f6368; }
        
        .api-select { margin: 10px; text-align: center; }
    </style>
</head>
<body>

    <div class="header">🇸🇴 SOMALI AI</div>

    <div class="api-select">
        <select id="api-provider">
            <option value="gemini">Gemini API</option>
            <option value="openai">OpenAI API</option>
            <option value="claude">Claude API</option>
        </select>
    </div>

    <div id="chat-box"></div>

    <div class="input-container">
        <input type="text" id="user-input" placeholder="Waxa aan kugu caawin karaa...">
        <button onclick="startVoice()">🎤</button>
        <button onclick="sendMessage()">➤</button>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('user-input');
            const provider = document.getElementById('api-provider').value;
            const message = input.value;
            
            if (!message) return;

            // Muuji qoraalka user-ka
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<p><b>Adiga:</b> ${message}</p>`;
            input.value = "";

            // Halkan ayaad ku darsataa Logic-ga API kasta
            console.log(`Waxaa la isticmaalayaa API-ga: ${provider}`);
            
            // Tusaale ahaan jawaab ka timid server-ka
            chatBox.innerHTML += `<p><b>${provider.toUpperCase()}:</b> Jawabaartu waa diyaar... (Connect-ka API-ga ayaan ku xirayaa)</p>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function startVoice() {
            alert("Microphone-ka wuu socdaa...");
        }
    </script>
</body>
</html>
