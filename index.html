<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somali AI - Gemini Style</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0e1117;
            --chat-bg: #161b22;
            --accent-color: #38bdf8;
            --text-color: #e6edf3;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* Background Watermark & Flag */
        body::before {
            content: "SOMALI AI 🇸🇴";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            font-size: 8rem;
            font-weight: 900;
            color: rgba(255, 255, 255, 0.03);
            z-index: -1;
            white-space: nowrap;
            pointer-events: none;
        }

        header {
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(14, 17, 23, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #30363d;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin: 0;
        }

        .flag { font-size: 1.5rem; }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scrollbar-width: thin;
        }

        .message {
            max-width: 85%;
            padding: 15px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .user-msg {
            align-self: flex-end;
            background: #1d4ed8;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot-msg {
            align-self: flex-start;
            background: var(--chat-bg);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
            border: 1px solid #30363d;
        }

        /* Input Area Style like Gemini */
        .input-wrapper {
            padding: 20px;
            background: transparent;
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            background: #21262d;
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 5px 15px;
            border: 1px solid #30363d;
            transition: border-color 0.3s;
        }

        .input-container:focus-within {
            border-color: var(--accent-color);
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px;
            color: white;
            font-size: 16px;
            outline: none;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            color: #8b949e;
        }

        .action-btns i {
            cursor: pointer;
            font-size: 1.2rem;
            padding: 10px;
            border-radius: 50%;
            transition: 0.3s;
        }

        .action-btns i:hover {
            color: var(--accent-color);
            background: #30363d;
        }

        .send-btn { color: var(--accent-color) !important; }
    </style>
</head>
<body>

<header>
    <h1>FriendFLT <small style="color: #8b949e; font-size: 0.7rem;">Somali AI</small></h1>
    <div class="flag">🇸🇴</div>
</header>

<div id="chat-container">
    <div class="message bot-msg">
        Iska wada dhig! Waxaan ahay FriendFLT AI. Sideen maanta kuu caawin karaa? 🇸🇴
    </div>
</div>

<div class="input-wrapper">
    <div class="input-container">
        <input type="text" id="userInput" placeholder="Halkan wax ku qor ama ku hadal..." onkeypress="if(event.key === 'Enter') send()">
        <div class="action-btns">
            <i class="fas fa-microphone" id="voiceBtn" title="Ku hadal"></i>
            <i class="fas fa-paper-plane send-btn" onclick="send()" title="Dir"></i>
        </div>
    </div>
</div>

<script>
    // ⚠️ HALKAAN GALI API KEY-GAAGA
    const API_KEY = 'YOUR_GROQ_API_KEY_HERE'; 

    async function send() {
        const input = document.getElementById('userInput');
        const container = document.getElementById('chat-container');
        const text = input.value.trim();

        if (!text) return;

        // User message
        container.innerHTML += `<div class="message user-msg">${text}</div>`;
        input.value = "";
        container.scrollTop = container.scrollHeight;

        // Loading
        const loadingMsg = document.createElement('div');
        loadingMsg.className = 'message bot-msg';
        loadingMsg.innerHTML = '<i class="fas fa-ellipsis-h fa-pulse"></i>';
        container.appendChild(loadingMsg);

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "llama3-8b-8192",
                    messages: [
                        { role: "system", content: "Waxaad tahay FriendFLT, AI khabiir ku ah coding-ka iyo research-ka, kuna hadla Af-Soomali." },
                        { role: "user", content: text }
                    ]
                })
            });

            const data = await response.json();
            loadingMsg.innerText = data.choices[0].message.content;
        } catch (e) {
            loadingMsg.innerText = "Khalad ayaa dhacay, fadlan hubi internet-kaaga iyo API Key-ga.";
        }
        container.scrollTop = container.scrollHeight;
    }

    // Voice Recognition Logic
    const voiceBtn = document.getElementById('voiceBtn');
    const recognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (recognition) {
        const sr = new recognition();
        sr.lang = 'so-SO'; // Isku day Somali, hadii kale 'en-US'

        voiceBtn.onclick = () => {
            sr.start();
            voiceBtn.style.color = "red";
        };

        sr.onresult = (e) => {
            const transcript = e.results[0][0].transcript;
            document.getElementById('userInput').value = transcript;
            voiceBtn.style.color = "#8b949e";
        };

        sr.onspeechend = () => { sr.stop(); voiceBtn.style.color = "#8b949e"; };
    } else {
        voiceBtn.style.display = "none"; // Haddii uusan browser-ku taageerin codka
    }
</script>

</body>
</html>
