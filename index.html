<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaawiyeFLT - OpenAI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0d1117; --chat: #161b22; --blue: #1d4ed8; --accent: #10a37f; --text: #e6edf3; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; align-items: center; }
        header { width: 100%; max-width: 600px; padding: 20px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; box-sizing: border-box; }
        #chat-box { width: 100%; max-width: 600px; flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
        .u { align-self: flex-end; background: var(--blue); color: white; border-bottom-right-radius: 4px; }
        .b { align-self: flex-start; background: var(--chat); border: 1px solid #333; border-bottom-left-radius: 4px; }
        .in-area { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; }
        .in-cont { background: #21262d; border-radius: 30px; display: flex; padding: 5px 15px; align-items: center; border: 1px solid #30363d; }
        input { flex: 1; background: none; border: none; color: white; padding: 12px; outline: none; font-size: 16px; }
        .btn { color: var(--accent); cursor: pointer; padding: 8px; font-size: 1.2rem; }
    </style>
</head>
<body>

<header>
    <h1 style="font-size: 1.1rem; margin:0; color:var(--accent);">CaawiyeFLT 🇸🇴 <small style="color:#8b949e; font-size:0.7rem;">OpenAI</small></h1>
    <span>🇸🇴</span>
</header>

<div id="chat-box">
    <div class="msg b">Iska wada dhig nio! CaawiyeFLT ayaan ahay. OpenAI ayaan hadda ku shaqaynayaa. Maxaan isku dhex ridaa? 😂🔥</div>
</div>

<div class="in-area">
    <div class="in-cont">
        <input type="text" id="userInput" placeholder="Wax ku qor..." onkeypress="if(event.key==='Enter') send()">
        <i class="fas fa-paper-plane btn" onclick="send()"></i>
    </div>
</div>

<script>
    // API KEY-GAAGA OPENAI
    const KEY = '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'; 

    async function send() {
        const input = document.getElementById('userInput');
        const box = document.getElementById('chat-box');
        const val = input.value.trim();
        if(!val) return;

        box.innerHTML += `<div class="msg u">${val}</div>`;
        input.value = "";
        
        const load = document.createElement('div');
        load.className = 'msg b';
        load.innerText = "Fikiraya...";
        box.appendChild(load);
        box.scrollTop = box.scrollHeight;

        try {
            const res = await fetch("https://api.openai.com/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${KEY}`
                },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: [
                        { role: "system", content: "Waxaad tahay CaawiyeFLT, AI Soomaali ah oo aad u furfuran, saaxiibtinimo leh, oo kaftan badan. U hadal sidii saaxiib." },
                        { role: "user", content: val }
                    ]
                })
            });

            const data = await res.json();
            
            if (data.choices && data.choices[0]) {
                load.innerText = data.choices[0].message.content;
            } else {
                // Haddii lacag la'aan jirto ama key-ga xun yahay
                load.innerText = "Nio, OpenAI waxay leedahay: " + (data.error ? data.error.message : "Khalad baa jira.");
            }
        } catch (e) {
            load.innerText = "Nio, internet-ka ama API-ga ayaa dhib leh.";
        }
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
