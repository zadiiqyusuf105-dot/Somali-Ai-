<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOMALI AI</title>
    <style>
        body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        .chat-container { width: 90%; max-width: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 20px; }
        
        h2 { text-align: center; color: #333; margin-top: 0; }
        
        .api-box { background: #f8f9fa; padding: 10px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #eee; }
        .api-box input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .chat-box { height: 300px; border: 1px solid #eee; border-radius: 15px; margin-bottom: 15px; overflow-y: auto; padding: 15px; background: #fafafa; }
        
        .input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        
        button { padding: 10px 15px; border: none; border-radius: 50%; background: #007bff; color: white; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>🇸🇴 SOMALI AI</h2>
    
    <div class="api-box">
        <input type="password" id="api-key" placeholder="Halkan geli API Key-gaaga...">
    </div>

    <div class="chat-box" id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Weydii waxaad rabto...">
        <button onclick="startVoice()">🎤</button>
        <button onclick="sendMessage()">➤</button>
    </div>
</div>

<script>
    function sendMessage() {
        const input = document.getElementById('user-input');
        const chatBox = document.getElementById('chat-box');
        const apiKey = document.getElementById('api-key').value;
        
        if (input.value.trim() === "") return;
        if (apiKey === "") { alert("Fadlan geli API Key-gaaga!"); return; }

        chatBox.innerHTML += `<p><b>Adiga:</b> ${input.value}</p>`;
        input.value = "";
        
        // Halkan ayaad ku xiri doontaa API-ga
        chatBox.innerHTML += `<p><i>SOMALI AI:</i> Xiriirka API-ga ayaa socda... ⚙️</p>`;
    }

    function startVoice() {
        alert("Microphone-ka waa diyaar, hadda hadal!");
    }
</script>

</body>
</html>
