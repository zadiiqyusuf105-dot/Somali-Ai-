<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CaawiyeFLT AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg: #0d1117; --chat: #161b22; --blue: #1d4ed8; --accent: #38bdf8; --text: #e6edf3; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; height: 100vh; align-items: center; }
        header { width: 100%; max-width: 600px; padding: 20px; display: flex; justify-content: space-between; border-bottom: 1px solid #30363d; box-sizing: border-box; }
        #chat-container { width: 100%; max-width: 600px; flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-sizing: border-box; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
        .u { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 4px; }
        .b { align-self: flex-start; background: var(--chat); border: 1px solid #30363d; border-bottom-left-radius: 4px; }
        .in-box { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; }
        .cont { background: #21262d; border-radius: 25px; display: flex; align-items: center; padding: 5px 15px; border: 1px solid #30363d; }
        input { flex: 1; background: none; border: none; padding: 10px; color: #fff; outline: none; }
        .btn { color: var(--accent); cursor: pointer; padding: 8px; font-size: 1.1rem; }
        .dots::after { content: '...'; animation: typing 1s infinite; }
        @keyframes typing { 0% { content: '.'; } 33% { content: '..'; } 66% { content: '...'; } }
    </style>
</head>
<body>

<header>
    <h1 style="font-size: 1.1rem; margin:0; color:var(--accent);">CaawiyeFLT 🇸🇴</h1>
</header>

<div id="chat-container">
    <div class="msg b">Iska wada dhig nio! Hadda wax walba waa diyaar. CaawiyeFLT ayaa hadda Live ah. Maxaan isku dhex ridaa maanta? 😂🔥</div>
</div>

<div class="in-box">
    <div class="cont">
        <input type="text" id="userInput" placeholder="Halkan wax ku qor..." onkeypress="if(event.key === 'Enter') send()">
        <i class="fas fa-microphone btn" id="mic" title="Ku hadal"></i>
        <i class="fas fa-paper-plane btn" onclick="send()" title="Dir"></i>
    </div>
</div>

<script>
    // API KEY-GAAGA CUSUB
    const KEY = 'AIzaSyCL9Tv9fz9ePE2FJVVJ7xJj51k7iCpReT0'; 

    async function send() {
        const input = document.getElementById('userInput');
        const container = document.getElementById('chat-container');
        const val = input.value.trim();
        if (!val) return;

        container.innerHTML += `<div class="msg u">${val}</div>`;
        input.value = "";
        container.scrollTop = container.scrollHeight;

        const load = document.createElement('div');
        load.className = 'msg b';
        load.innerHTML = 'Fikiraya <span class="dots"></span>';
        container.appendChild(load);
        container.scrollTop = container.scrollHeight;

        try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: [{ parts: [{ text: "Waxaad tahay CaawiyeFLT, AI Soomaali ah oo kaftan iyo sheeko yaqaan ah. Ha u hadlin sidii robot qallafsan. Su'aashu waa: " + val }] }] })
            });
            const data = await res.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                load.innerText = data.candidates[0].content.parts[0].text;
            } else {
                load.innerText = "Nio, waxaa jira dhib xagga jawaabta ah. Hubi API Key-gaaga.";
            }

        } catch (e) {
            load.innerText = "Nio, API-ga ayaa yara 'busy' ah ama dhib ayaa jira. Mar kale isku day!";
        }
        container.scrollTop = container.scrollHeight;
    }

    // Microphone Logic
    const mic = document.getElementById('mic');
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (Rec) {
        const sr = new Rec(); sr.lang = 'so-SO';
        mic.onclick = () => { sr.start(); mic.style.color = "red"; };
        sr.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; mic.style.color = "#38bdf8"; };
        sr.onspeechend = () => { sr.stop(); mic.style.color = "#38bdf8"; };
    } else {
        mic.style.display = "none";
    }
</script>
</body>
</html>
